name: Security

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - web/package.json
      - web/package-lock.json
      - .github/workflows/security.yml
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - web/package.json
      - web/package-lock.json
  schedule:
    - cron: '23 5 * * 1' # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Reports only vulnerabilities in code paths the binary actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  npm-audit:
    name: npm audit (runtime dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Only dependencies shipped in the bundle; dev tooling advisories are
      # handled by Dependabot to keep this check low-noise.
      - run: npm audit --omit=dev --audit-level=high
