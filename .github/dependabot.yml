version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tanstack:
        patterns: ['@tanstack/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports typescript <6.1; bump TypeScript's major
      # together with typescript-eslint once it supports the new version.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node.js LTS lines (even majors); move to the next LTS manually
      # together with the node-version used in the workflows.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
