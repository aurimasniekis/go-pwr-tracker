name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not include secrets, tokens or private URLs.
        Security issues: see SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pwr-tracker version` or the image tag.
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options: [Docker Compose, Docker, Standalone binary, Built from source]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: FETCH_MODE
      options: [direct, flaresolverr]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: JSON log lines around the problem. Redact anything sensitive.
      render: json
